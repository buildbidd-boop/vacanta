<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificare coordonate</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 20px;
    background: #fff;
    color: #111;
  }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  #count { color: #666; font-size: 0.9rem; margin-top: 0; }
  h2 {
    font-size: 1rem;
    margin-top: 28px;
    padding-bottom: 6px;
    border-bottom: 1px solid #ddd;
  }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
  }
  .label { font-size: 0.95rem; }
  .coords {
    display: block;
    color: #777;
    font-size: 0.8rem;
    font-family: monospace;
    margin-top: 2px;
  }
  a.btn {
    flex-shrink: 0;
    background: #1B4B78;
    color: #fff;
    text-decoration: none;
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 0.85rem;
    white-space: nowrap;
  }
  a.btn:active { opacity: 0.85; }
</style>
</head>
<body>

<h1>Verificare coordonate</h1>
<p id="count">Se încarcă...</p>
<div id="list"></div>

<script src="data.js"></script>
<script>
  const container = document.getElementById('list');
  let total = 0;

  TRIP_DAYS.forEach((day) => {
    const stops = day.stops.filter((s) => s.lat != null && s.lng != null);
    if (!stops.length) return;

    const h2 = document.createElement('h2');
    h2.textContent = `Ziua ${day.id} — ${day.date} (${day.weekday}) — ${day.title}`;
    container.appendChild(h2);

    const ul = document.createElement('ul');
    stops.forEach((s) => {
      total++;
      const li = document.createElement('li');
      li.innerHTML = `
        <span class="label">${s.order}. ${s.title}<span class="coords">${s.lat}, ${s.lng}</span></span>
        <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}">Deschide</a>
      `;
      ul.appendChild(li);
    });
    container.appendChild(ul);
  });

  document.getElementById('count').textContent = `${total} puncte cu coordonate, din ${TRIP_DAYS.length} zile.`;
</script>
</body>
</html>
